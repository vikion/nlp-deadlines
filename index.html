<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLP Deadlines</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--card:#fff;--bd:#e7e5e4;--acc:#2563eb;--soon:#dc2626;--mid:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#141210;--fg:#f5f5f4;--mut:#a8a29e;--card:#1c1917;--bd:#33302d;--acc:#60a5fa;--soon:#f87171;--mid:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 4px;font-size:1.8rem}.sub{color:var(--mut);margin:0 0 20px;font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
input[type=search]{flex:1 1 200px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
button.chip{padding:6px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--card);color:var(--fg);font:inherit;font-size:.85rem;cursor:pointer}
button.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
label.past{font-size:.85rem;color:var(--mut);display:flex;gap:6px;align-items:center}
h2{font-size:1rem;margin:28px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.row{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.date{font-weight:600;font-variant-numeric:tabular-nums}.date small{display:block;font-weight:400;color:var(--mut);font-size:.75rem}
.name a{color:var(--fg);font-weight:600;text-decoration:none}.name a:hover{color:var(--acc)}
.meta{color:var(--mut);font-size:.85rem}
.cd{font-size:.85rem;font-weight:600;white-space:nowrap}.cd.soon{color:var(--soon)}.cd.mid{color:var(--mid)}.cd.past{color:var(--mut);font-weight:400}
.tag{font-size:.7rem;border:1px solid var(--bd);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--mut);vertical-align:middle}
.row.past{opacity:.55}
@media(max-width:560px){.row{grid-template-columns:1fr;gap:2px}}
footer{margin-top:32px;color:var(--mut);font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>NLP Deadlines</h1>
<p class="sub" id="sub">Loading…</p>
<div class="bar">
  <input type="search" id="q" placeholder="Search venue, place, year…" aria-label="Search">
  <span id="chips"></span>
  <label class="past"><input type="checkbox" id="past"> show past</label>
</div>
<div id="list"></div>
<footer>Deadlines are AoE (UTC−12) unless noted; a deadline passes when it is midnight AoE, not in your timezone. Always confirm on the official site. Data: hand-curated + <a href="https://github.com/ccfddl/ccf-deadlines">ccf-deadlines</a>, refreshed daily.</footer>
</main>
<script>
const CATS={all:"All",conference:"Conferences",shared_task:"Shared tasks",school:"Schools",fellowship:"PhD & fellowships"};
let all=[],cat="all";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("data/deadlines.json").then(r=>r.json()).then(d=>{
  all=d.entries.map(e=>({...e,ts:e.date?new Date(e.precision==="month"?e.date+"-28T23:59:00-12:00":e.date).getTime():null}));
  $("sub").textContent="Conferences, shared tasks, schools and fellowships for NLP researchers · updated "+d.generated.slice(0,10);
  render();
}).catch(()=>{$("sub").textContent="Could not load data/deadlines.json (open via a web server or GitHub Pages)."});
$("chips").innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="${k==="all"}">${v}</button>`).join(" ");
$("chips").onclick=e=>{const k=e.target.dataset.k;if(!k)return;cat=k;document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));render()};
$("q").oninput=render;$("past").onchange=render;
function cd(ts,approx){
  if(approx)return{t:"tentative",c:""};
  const d=Math.ceil((ts-Date.now())/864e5);
  if(d<0)return{t:"passed",c:"past"};
  if(d===0)return{t:"today",c:"soon"};
  return{t:`${d} day${d>1?"s":""}`,c:d<=14?"soon":d<=45?"mid":""};
}
function row(e){
  const approx=e.precision==="month",c=e.ts!=null?cd(e.ts,approx):null;
  const when=e.ts==null?"TBA":approx?new Date(e.ts).toLocaleDateString("en",{month:"short",year:"numeric",timeZone:"UTC"}):new Date(e.ts).toLocaleDateString("en",{day:"numeric",month:"short",year:"numeric",timeZone:"Etc/GMT+12"});
  const meta=[e.event_dates&&"Event: "+e.event_dates,e.place,e.note].filter(Boolean).join(" · ");
  const name=`${esc(e.venue)} ${e.year} — ${esc(e.label)}`;
  return `<div class="row${c&&c.c==="past"?" past":""}"><div class="date">${when}${e.ts!=null&&!approx?"<small>AoE</small>":""}</div>
  <div class="name">${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">${name}</a>`:name}<span class="tag">${CATS[e.category]||""}</span><div class="meta">${esc(meta)}</div></div>
  <div class="cd ${c?c.c:""}">${c?c.t:""}</div></div>`;
}
function render(){
  const q=$("q").value.toLowerCase(),sp=$("past").checked,now=Date.now();
  const f=all.filter(e=>(cat==="all"||e.category===cat)&&JSON.stringify(e).toLowerCase().includes(q)&&(sp||e.ts==null||e.ts>=now-864e5));
  const dated=f.filter(e=>e.ts!=null).sort((a,b)=>a.ts-b.ts),tba=f.filter(e=>e.ts==null);
  $("list").innerHTML=(dated.length?"<h2>Dated</h2>"+dated.map(row).join(""):"")+(tba.length?"<h2>Date not announced / check website</h2>"+tba.map(row).join(""):"")||"<p class=meta>Nothing matches.</p>";
}
</script>
</body>
</html>
