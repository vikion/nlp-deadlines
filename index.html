<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLP Deadlines</title>
<meta name="description" content="Upcoming deadlines for NLP researchers: conferences, shared tasks, schools and funding.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--fg:#111;--mut:#737373;--line:#e8e8e8;--fill:#f6f6f6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--fg);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
a{color:inherit}
:focus-visible{outline:2px solid #111;outline-offset:3px;border-radius:4px}
main{max-width:720px;margin:0 auto;padding:0 24px 96px}
.top{display:flex;justify-content:space-between;align-items:center;padding:28px 0;font-size:.9rem}
.top a{color:var(--mut);text-decoration:none}.top a:hover{color:var(--fg)}
.top b{font-weight:600}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:56px 0 6px}
.sub{color:var(--mut);font-size:.95rem;margin:0;max-width:34em}
#next{margin:28px 0 0;font-size:.95rem}
#next a{text-decoration:none;display:inline-block;padding-bottom:2px;border-bottom:1px solid var(--line);transition:border-color .2s}
#next a:hover{border-color:var(--fg)}
#next span{color:var(--mut)}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-top:40px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#nav{display:flex;gap:22px;flex-wrap:wrap}
#nav button{all:unset;cursor:pointer;color:var(--mut);padding:14px 0 12px;border-bottom:2px solid transparent;font-size:.9rem;transition:color .2s}
#nav button:hover{color:var(--fg)}
#nav button[aria-pressed=true]{color:var(--fg);border-color:var(--fg);font-weight:500}
#nav button:focus-visible{outline-offset:-2px}
.search input{border:0;background:none;font:inherit;font-size:.9rem;width:130px;padding:8px 0;outline:none;color:var(--fg)}
.search input::placeholder{color:var(--mut)}
.search input:focus-visible{outline:0}
.search svg{display:none}
h2.m,summary{font-size:.85rem;font-weight:500;color:var(--mut);margin:48px 0 4px;letter-spacing:0}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:60px 1fr auto;gap:0 20px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line);cursor:pointer}
h2.m+ul>li:first-child,summary+ul>li:first-child{border-top-color:var(--fg)}
li:hover .t b{text-decoration:underline;text-underline-offset:3px}
li.past{opacity:.45}
.date{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.date small{font-size:inherit;text-transform:none;margin-right:4px}
.date b{font-weight:400;color:var(--fg)}
.date.tba b{color:var(--mut)}
.t b{font-weight:600}
.w{color:var(--fg)}
.d{color:var(--mut);font-size:.85rem;margin-top:2px}
.cd{color:var(--mut);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.cd.soon{color:var(--fg);font-weight:500}
.chev{display:none}
details{margin-top:0}
summary{cursor:pointer;list-style:none;display:flex;gap:6px;margin-top:64px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:2px}
details[open] summary::after{content:"–"}
.tog{all:unset;cursor:pointer;color:var(--mut);font-size:.9rem;margin-top:40px;display:inline-block;border-bottom:1px solid var(--line)}
.tog:hover{color:var(--fg);border-color:var(--fg)}
.empty{color:var(--mut);margin-top:40px}
footer{margin-top:88px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:.8rem;line-height:1.7}
footer a{text-underline-offset:2px}
dialog{border:0;border-radius:12px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 48px);color:var(--fg);background:#fff;box-shadow:0 20px 60px -10px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.05)}
dialog[open]{animation:pop .25s ease}
dialog::backdrop{background:rgba(255,255,255,.75);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.sheet{padding:32px;overflow:auto;max-height:calc(100vh - 48px)}
.x{all:unset;cursor:pointer;position:absolute;top:18px;right:18px;width:28px;height:28px;display:grid;place-items:center;color:var(--mut);font-size:1.3rem;border-radius:50%}
.x:hover{background:var(--fill);color:var(--fg)}
.kind{font-size:.85rem;color:var(--mut)}
.sheet h3{font-size:2rem;font-weight:600;letter-spacing:-.04em;line-height:1.1;margin:4px 0 6px;padding-right:32px}
.meta{color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 4px}
.btn{font-size:.9rem;text-decoration:none;padding:9px 16px;border-radius:8px;border:1px solid var(--line);color:var(--fg);transition:border-color .2s}
.btn:hover{border-color:#111}
.btn.p{background:#111;color:#fff;border-color:#111}
.btn.p:hover{background:#333}
.tl{margin-top:26px}
.tl h4{font-size:.85rem;font-weight:500;color:var(--mut);margin:0 0 6px}
.tr{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.tr .r{color:var(--mut);white-space:nowrap}
.tr.now .l,.tr.now .r{color:var(--fg);font-weight:500}
.tr.gone{opacity:.4}
.notes{margin-top:18px;color:var(--mut);font-size:.85rem}
.note-aoe{margin-top:16px;color:var(--mut);font-size:.75rem}
@media(max-width:560px){main{padding:0 20px 72px}h1{margin-top:36px}li{grid-template-columns:44px 1fr auto;gap:0 12px}.sheet{padding:26px 22px}.sheet h3{font-size:1.6rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>NLP deadlines</h1>
<p class="sub" id="sub">&nbsp;</p>
<div id="next"></div>
<div class="bar"><div id="nav" role="group" aria-label="Filter"></div><label class="search"><svg viewBox="0 0 16 16"></svg><input type="search" id="q" placeholder="Search" aria-label="Search"></label></div>
<div id="list"></div>
<button class="tog" id="tog" aria-pressed="false"></button>
<dialog id="dlg" aria-label="Event details"></dialog>
<footer>Times are “anywhere on Earth” (UTC−12) unless noted. Always confirm on the official site.<br>Data: hand-checked + <a href="https://github.com/ccfddl/ccf-deadlines">ccf-deadlines</a>, refreshed daily.</footer>
</main>
<script>
const CATS={all:"All",conference:"Conferences",shared_task:"Shared tasks",school:"Schools",fellowship:"Funding"};
const MINOR=/camera|notification|workshop|proposal|show & tell|update deadline|evaluation period|tutorial|challenge|special session|satellite|open on openreview/i;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let all=[],cat="all",full=false,q="",venues={};
$("nav").innerHTML=Object.entries(CATS).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k==='all'}">${v}</button>`).join("");
$("nav").onclick=e=>{const k=e.target.dataset.k;if(!k)return;cat=k;document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));render()};
$("q").oninput=e=>{q=e.target.value.toLowerCase();render()};
$("tog").onclick=()=>{full=!full;render()};
fetch("data/deadlines.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  venues=d.venues||{};all=d.entries.map(e=>{const ap=e.precision==="month";return{...e,ap,minor:MINOR.test(e.label),ts:e.date?new Date(ap?e.date+"-28T23:59:00-12:00":e.date).getTime():null}});
  $("sub").textContent="Conferences, shared tasks, schools and funding. Updated "+d.generated.slice(0,10)+".";
  hero();render();openHash();
}).catch(()=>{$("sub").textContent="Could not load the data. Open this page through GitHub Pages or a local web server."});

const dlg=$("dlg");
const cats={conference:"Conference",shared_task:"Shared task",school:"School",fellowship:"Funding"};
function open(key){
  const g=all.filter(e=>e.venue+" "+e.year===key).sort((a,b)=>(a.ts??9e15)-(b.ts??9e15));
  if(!g.length)return;
  const e0=g[0],ev=g.find(e=>e.event_dates)?.event_dates,pl=g.find(e=>e.place)?.place;
  let links=venues[key];
  if(!links){const u=[...new Set(g.map(e=>e.link).filter(Boolean))];links=u.map((url,i)=>({label:i?"Link":"Website",url,primary:!i}))}
  const now=Date.now(),nxt=g.find(e=>e.ts!=null&&!e.ap&&e.ts>=now);
  const rows=g.map(e=>{
    const when=e.ts==null?"Date TBA":e.ap?fmt(e.ts,{month:"long",year:"numeric"})+" (tentative)":fmt(e.ts,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    const gone=e.ts!=null&&!e.ap&&e.ts<now;
    return `<div class="tr${e===nxt?" now":""}${gone?" gone":""}"><span class="l">${esc(e.label)}</span><span class="r">${when}</span></div>`}).join("");
  const notes=[...new Set(g.map(e=>e.note).filter(Boolean))];
  dlg.innerHTML=`<div class="sheet"><button class="x" aria-label="Close">×</button>
  <div class="kind">${cats[e0.category]||""}</div>
  <h3>${esc(key)}</h3><div class="meta">${[ev&&"Event "+esc(ev),esc(pl)].filter(Boolean).join(" · ")}</div>
  <div class="acts">${links.map(l=>`<a class="btn${l.primary?" p":""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
  <div class="tl"><h4>Key dates</h4>${rows}</div>
  ${notes.length?`<div class="notes">${notes.map(esc).join("<br>")}</div>`:""}
  <div class="note-aoe">Times are AoE (UTC−12) unless noted. Confirm on the official site.</div></div>`;
  dlg.querySelector(".x").onclick=()=>dlg.close();
  if(!dlg.open)dlg.showModal();
  history.replaceState(null,"","#"+encodeURIComponent(key.replace(/ /g,"-")));
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener("close",()=>history.replaceState(null,"",location.pathname+location.search));
$("list").addEventListener("click",e=>{const li=e.target.closest("li[data-k]");if(li)open(li.dataset.k)});
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const li=e.target.closest("li[data-k]");if(li){e.preventDefault();open(li.dataset.k)}}});
function openHash(){if(location.hash.length>1)open(decodeURIComponent(location.hash.slice(1)).replace(/-/g," "))}
const AOE="Etc/GMT+12",fmt=(ts,o)=>new Date(ts).toLocaleDateString("en",{...o,timeZone:AOE});
function cd(e){
  if(e.ap)return{t:"tentative"};
  const d=Math.ceil((e.ts-Date.now())/864e5);
  return d<0?{t:"passed"}:d===0?{t:"today",s:1}:{t:d===1?"tomorrow":d+" days",s:d<=14};
}
function item(e){
  const c=e.ts!=null?cd(e):null,past=c&&c.t==="passed";
  const date=e.ts==null?`<div class="date tba"><b>TBA</b></div>`:`<div class="date"><small>${fmt(e.ts,{month:"short"})}</small><b>${e.ap?"~":fmt(e.ts,{day:"numeric"})}</b></div>`;
  const name=`${esc(e.venue)} ${e.year}`,link=`<b>${name}</b>`;
  const det=[e.also&&"For "+e.also.map(x=>x.venue+" "+x.year+(x.place?" ("+x.place+")":"")).join(" · "),e.event_dates&&(e.ts==null?"":"Event ")+e.event_dates,e.place,e.note].filter(Boolean).join(" · ");
  return `<li tabindex="0" role="button" data-k="${esc(e.venue+" "+e.year)}" class="${past?"past":""}">${date}<div class="t">${link} <span class="w">${esc(e.label)}</span>${det?`<div class="d">${esc(det)}</div>`:""}</div>${c?`<span class="cd${c.s?" soon":""}">${c.t}</span>`:"<span></span>"}<span class="chev">›</span></li>`;
}

function hero(){
  const now=Date.now(),nx=all.filter(e=>e.ts!=null&&!e.ap&&e.ts>=now&&!e.minor).sort((a,b)=>a.ts-b.ts)[0];
  if(!nx){$("next").innerHTML="";return}
  const c=cd(nx),k=nx.venue+" "+nx.year;
  $("next").innerHTML=`<a href="#${encodeURIComponent(k.replace(/ /g,"-"))}" data-k="${esc(k)}">Next: <b>${esc(k)}</b> ${esc(nx.label.charAt(0).toLowerCase()+nx.label.slice(1))}, ${fmt(nx.ts,{month:"long",day:"numeric"})} <span>· ${c.t==="today"||c.t==="tomorrow"?c.t:"in "+c.t} →</span></a>`;
  $("next").firstChild.onclick=ev=>{ev.preventDefault();open(k)};
}
function render(){
  const now=Date.now();
  const f=all.filter(e=>(cat==="all"||e.category===cat)&&(!q||JSON.stringify(e).toLowerCase().includes(q))&&(full||((e.ts==null||e.ts>=now-864e5)&&!e.minor)));
  const dated=f.filter(e=>e.ts!=null).sort((a,b)=>a.ts-b.ts),tba=f.filter(e=>e.ts==null);
  const arr=dated.filter(e=>e.venue==="ARR"&&/submission/i.test(e.label));
  const dup=e=>e.venue!=="ARR"&&/^ARR submission/i.test(e.label)&&arr.some(a=>a.ts===e.ts);
  arr.forEach(a=>a.also=dated.filter(e=>dup(e)&&e.ts===a.ts));
  dated.splice(0,dated.length,...dated.filter(e=>!dup(e)));
  let html="",m="";
  for(const e of dated){
    const k=fmt(e.ts,{month:"long",year:"numeric"});
    if(k!==m){html+=(m?"</ul>":"")+`<h2 class="m">${k}</h2><ul>`;m=k}
    html+=item(e);
  }
  if(m)html+="</ul>";
  if(tba.length)html+=`<details${q||cat!=="all"?" open":""}><summary>Not announced yet <span>${tba.length}</span></summary><ul>${tba.map(item).join("")}</ul></details>`;
  const nx=(!q&&!full)?dated.find(e=>!e.ap&&e.ts>=now):null;
  $("list").innerHTML=html||`<p class="empty">Nothing matches.</p>`;
  $("tog").textContent=full?"Show key deadlines only":"Show all milestones and past dates";
}
</script>
</body>
</html>
