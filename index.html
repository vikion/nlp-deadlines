<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLP Deadlines</title>
<meta name="description" content="Upcoming deadlines for NLP researchers: conferences, shared tasks, schools and funding.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Caslon+Text:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#111;--mut:#77706a;--line:#e6e2dc;--brown:#7a5a35;--sans:Inter,"Helvetica Neue",Arial,sans-serif;--serif:"Libre Caslon Text","Times New Roman",serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:22px;font:15px/1.5 var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;background-color:#a88a58;background-image:repeating-linear-gradient(0deg,rgba(60,35,10,.16) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,240,210,.12) 0 1px,transparent 1px 3px)}
a{color:inherit}
:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
.sheet-page{background:#fff;min-height:calc(100vh - 44px);display:grid;grid-template-columns:150px minmax(0,1fr);position:relative}
.side{position:relative}
.vert{position:sticky;top:0;height:100vh;max-height:calc(100vh - 44px);display:flex;align-items:flex-end;justify-content:center;padding:36px 0}
.vert span{writing-mode:vertical-rl;transform:rotate(180deg);font:500 clamp(4rem,11vw,8.4rem)/.82 var(--sans);letter-spacing:-.045em;text-transform:uppercase}
.col{padding:30px 44px 80px 0;max-width:960px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
#nav{display:flex;gap:clamp(18px,4vw,52px);flex-wrap:wrap;padding-top:6px}
#nav button{all:unset;cursor:pointer;font:400 .78rem/1 var(--serif);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:4px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
#nav button svg{display:none}
#nav button:hover{color:var(--ink)}
#nav button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}
#nav button:focus-visible{outline-offset:4px}
.mark{font:500 clamp(1.8rem,4vw,2.8rem)/1 var(--sans);letter-spacing:-.05em;text-transform:uppercase;white-space:nowrap}
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-top:72px;flex-wrap:wrap}
.sub{margin:0;max-width:19em;font:400 .78rem/1.55 var(--serif);text-transform:uppercase;letter-spacing:.04em}
#next a{display:flex;align-items:flex-end;gap:20px;text-decoration:none}
#next .num{font:500 clamp(5rem,14vw,10rem)/.78 var(--sans);letter-spacing:-.07em;font-variant-numeric:tabular-nums}
#next .cap{display:block;padding-bottom:4px;font:400 .78rem/1.5 var(--serif);text-transform:uppercase;letter-spacing:.05em}
#next .cap i{display:block;font-style:normal;color:var(--mut)}
#next .cap b{display:block;font:600 1rem var(--sans);letter-spacing:-.01em;margin-top:6px;color:var(--brown)}
#next .cap em{display:block;font-style:normal;margin-top:2px}
#next a:hover .cap b{text-decoration:underline;text-underline-offset:3px}
.tools{margin-top:72px;display:flex;justify-content:flex-end;border-bottom:1px solid var(--ink);padding-bottom:10px}
.search input{border:0;background:none;font:400 .78rem var(--serif);text-transform:uppercase;letter-spacing:.06em;text-align:right;width:180px;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--mut)}
.search svg{display:none}
h2.m,summary{font:500 1.6rem/1 var(--sans);letter-spacing:-.04em;text-transform:uppercase;color:var(--ink);margin:56px 0 8px}
summary{cursor:pointer;list-style:none;margin-top:72px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:10px;color:var(--mut)}
details[open] summary::after{content:"–"}
summary span{color:var(--mut);font-weight:400}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:76px 1fr auto;gap:0 20px;align-items:baseline;padding:18px 0;border-top:1px solid var(--line);cursor:pointer;transition:padding .25s}
h2.m+ul>li:first-child,summary+ul>li:first-child{border-top-color:var(--ink)}
li:hover{padding-left:10px}
li:hover .t b{color:var(--brown)}
li.past{opacity:.4}
.date{white-space:nowrap;line-height:1}
.date small{font:400 .72rem var(--serif);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-right:4px;display:block;margin-bottom:5px}
.date b{font:500 1.7rem var(--sans);letter-spacing:-.04em}
.date.tba b{font:400 .78rem var(--serif);text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.t b{font:600 1rem var(--sans);letter-spacing:-.01em;transition:color .2s}
.w{font-weight:400}
.d{color:var(--mut);font:400 .78rem/1.5 var(--serif);margin-top:4px}
.tag{display:inline-block;margin-top:6px;font:400 .68rem var(--serif);text-transform:uppercase;letter-spacing:.08em;color:var(--brown)}
.cd{font:400 .78rem var(--serif);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);white-space:nowrap}
.cd.soon{color:var(--brown);font-weight:700}
.chev{display:none}
.tog{all:unset;cursor:pointer;display:block;margin-top:56px;font:400 .78rem var(--serif);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--ink);padding-bottom:3px;width:max-content}
.tog:hover{color:var(--brown);border-color:var(--brown)}
.empty{color:var(--mut);margin-top:40px}
footer{margin-top:96px;color:var(--mut);font:400 .72rem/1.8 var(--serif);text-transform:uppercase;letter-spacing:.05em}
footer a{text-underline-offset:2px}
dialog{border:0;border-radius:0;padding:0;width:min(600px,calc(100vw - 24px));max-height:calc(100vh - 48px);color:var(--ink);background:#fff;box-shadow:0 0 0 12px rgba(168,138,88,.9)}
dialog[open]{animation:pop .25s ease}
dialog::backdrop{background:rgba(255,255,255,.7);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.sheet{padding:40px;overflow:auto;max-height:calc(100vh - 48px)}
.x{all:unset;cursor:pointer;position:absolute;top:16px;right:20px;font-size:1.6rem;color:var(--mut);line-height:1}
.x:hover{color:var(--ink)}
.kind{font:400 .72rem var(--serif);text-transform:uppercase;letter-spacing:.08em;color:var(--brown)}
.sheet h3{font:500 clamp(2.2rem,6vw,3.2rem)/1 var(--sans);letter-spacing:-.05em;text-transform:uppercase;margin:10px 0 10px;padding-right:30px}
.meta{font:400 .78rem/1.6 var(--serif);text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 6px}
.btn{font:400 .75rem var(--serif);text-transform:uppercase;letter-spacing:.08em;text-decoration:none;padding:12px 20px;border:1px solid var(--ink);color:var(--ink);transition:background .2s,color .2s}
.btn:hover{background:var(--ink);color:#fff}
.btn.p{background:var(--ink);color:#fff}
.btn.p:hover{background:var(--brown);border-color:var(--brown)}
.tl{margin-top:30px}
.tl h4{font:400 .72rem var(--serif);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 6px}
.tr{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
.tl h4+.tr{border-top:1px solid var(--ink)}
.tr .r{color:var(--mut);white-space:nowrap}
.tr.now .l,.tr.now .r{color:var(--brown);font-weight:600}
.tr.gone{opacity:.4}
.notes{margin-top:18px;color:var(--mut);font-size:.85rem}
.note-aoe{margin-top:16px;color:var(--mut);font:400 .68rem var(--serif);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:760px){body{padding:10px}.sheet-page{grid-template-columns:1fr;min-height:calc(100vh - 20px)}.vert{position:static;height:auto;max-height:none;padding:22px 20px 0;justify-content:flex-start}.vert span{writing-mode:horizontal-tb;transform:none;font-size:clamp(3rem,15vw,5rem);line-height:.9}.col{padding:20px 20px 64px}.top{flex-direction:column-reverse;gap:18px}.intro{margin-top:40px}.tools{margin-top:40px}li{grid-template-columns:60px 1fr auto;gap:0 12px}.sheet{padding:30px 22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sheet-page">
<aside class="side"><div class="vert"><span>Deadlines</span></div></aside>
<main class="col">
<div class="top"><div id="nav" role="group" aria-label="Filter"></div><div class="mark">NLP</div></div>
<div class="intro"><p class="sub" id="sub">&nbsp;</p><div id="next"></div></div>
<div class="tools"><label class="search"><svg viewBox="0 0 16 16"></svg><input type="search" id="q" placeholder="Search" aria-label="Search"></label></div>
<div id="list"></div>
<button class="tog" id="tog" aria-pressed="false"></button>
<dialog id="dlg" aria-label="Event details"></dialog>
<footer>Times are “anywhere on Earth” (UTC−12) unless noted. Confirm on the official site.<br><span id="upd"></span> · Data: hand-checked + <a href="https://github.com/ccfddl/ccf-deadlines">ccf-deadlines</a>, refreshed daily · <a href="https://github.com/vikion/nlp-deadlines">GitHub</a></footer>
</main>
</div>
<script>
const CATS={all:"All",conference:"Conferences",shared_task:"Shared tasks",school:"Schools",fellowship:"Funding"};
const MINOR=/camera|notification|workshop|proposal|show & tell|update deadline|evaluation period|tutorial|challenge|special session|satellite|open on openreview/i;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let all=[],cat="all",full=false,q="",venues={};
const IC={all:`<path d="M24 8v32M8 24h32M13 13l22 22M35 13L13 35"/>`,conference:`<path d="M12 8h20l6 6v26H12z"/><path d="M32 8v6h6M17 22h16M17 28h16M17 34h10"/>`,shared_task:`<path d="M16 8h16v10a8 8 0 0 1-16 0zM16 12H9v3a6 6 0 0 0 7 6M32 12h7v3a6 6 0 0 1-7 6M24 26v8M17 40h14"/>`,school:`<path d="M4 18L24 8l20 10-20 10zM12 23v10c0 3 6 6 12 6s12-3 12-6V23M44 18v12"/>`,fellowship:`<circle cx="24" cy="24" r="15"/><path d="M24 15v18M18 20c0-4 12-4 12 0s-12 3-12 7 12 4 12 0"/>`};
$("nav").innerHTML=Object.entries(CATS).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k==='all'}"><svg viewBox="0 0 48 48" aria-hidden="true">${IC[k]}</svg><span>${v}</span></button>`).join("");
$("nav").onclick=e=>{const bt=e.target.closest("button");const k=bt&&bt.dataset.k;if(!k)return;cat=k;document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));render()};
$("q").oninput=e=>{q=e.target.value.toLowerCase();render()};
$("tog").onclick=()=>{full=!full;render()};
fetch("data/deadlines.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  venues=d.venues||{};all=d.entries.map(e=>{const ap=e.precision==="month";return{...e,ap,minor:MINOR.test(e.label),ts:e.date?new Date(ap?e.date+"-28T23:59:00-12:00":e.date).getTime():null}});
  $("sub").textContent="A complete list of deadlines for NLP researchers: conferences, shared tasks, schools and funding.";
  $("upd").textContent="Updated "+d.generated.slice(0,10);hero();render();openHash();
}).catch(()=>{$("sub").textContent="Could not load the data. Open this page through GitHub Pages or a local web server."});

const dlg=$("dlg");
const cats={conference:"Conference",shared_task:"Shared task",school:"School",fellowship:"Funding"};
function open(key){
  const g=all.filter(e=>e.venue+" "+e.year===key).sort((a,b)=>(a.ts??9e15)-(b.ts??9e15));
  if(!g.length)return;
  const e0=g[0],ev=g.find(e=>e.event_dates)?.event_dates,pl=g.find(e=>e.place)?.place;
  let links=venues[key];
  if(!links){const u=[...new Set(g.map(e=>e.link).filter(Boolean))];links=u.map((url,i)=>({label:i?"Link":"Website",url,primary:!i}))}
  const now=Date.now(),nxt=g.find(e=>e.ts!=null&&!e.ap&&e.ts>=now);
  const rows=g.map(e=>{
    const when=e.ts==null?"Date TBA":e.ap?fmt(e.ts,{month:"long",year:"numeric"})+" (tentative)":fmt(e.ts,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    const gone=e.ts!=null&&!e.ap&&e.ts<now;
    return `<div class="tr${e===nxt?" now":""}${gone?" gone":""}"><span class="l">${esc(e.label)}</span><span class="r">${when}</span></div>`}).join("");
  const notes=[...new Set(g.map(e=>e.note).filter(Boolean))];
  dlg.innerHTML=`<div class="sheet"><button class="x" aria-label="Close">×</button>
  <div class="kind">${cats[e0.category]||""}</div>
  <h3>${esc(key)}</h3><div class="meta">${[ev&&"Event "+esc(ev),esc(pl)].filter(Boolean).join(" · ")}</div>
  <div class="acts">${links.map(l=>`<a class="btn${l.primary?" p":""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
  <div class="tl"><h4>Key dates</h4>${rows}</div>
  ${notes.length?`<div class="notes">${notes.map(esc).join("<br>")}</div>`:""}
  <div class="note-aoe">Times are AoE (UTC−12) unless noted. Confirm on the official site.</div></div>`;
  dlg.querySelector(".x").onclick=()=>dlg.close();
  if(!dlg.open)dlg.showModal();
  history.replaceState(null,"","#"+encodeURIComponent(key.replace(/ /g,"-")));
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener("close",()=>history.replaceState(null,"",location.pathname+location.search));
$("list").addEventListener("click",e=>{const li=e.target.closest("li[data-k]");if(li)open(li.dataset.k)});
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const li=e.target.closest("li[data-k]");if(li){e.preventDefault();open(li.dataset.k)}}});
function openHash(){if(location.hash.length>1)open(decodeURIComponent(location.hash.slice(1)).replace(/-/g," "))}
const AOE="Etc/GMT+12",fmt=(ts,o)=>new Date(ts).toLocaleDateString("en",{...o,timeZone:AOE});
function cd(e){
  if(e.ap)return{t:"tentative"};
  const d=Math.ceil((e.ts-Date.now())/864e5);
  return d<0?{t:"passed"}:d===0?{t:"today",s:1}:{t:d===1?"tomorrow":d+" days",s:d<=14};
}
function item(e){
  const c=e.ts!=null?cd(e):null,past=c&&c.t==="passed";
  const date=e.ts==null?`<div class="date tba"><b>TBA</b></div>`:`<div class="date"><small>${fmt(e.ts,{month:"short"})}</small><b>${e.ap?"~":fmt(e.ts,{day:"numeric"})}</b></div>`;
  const name=`${esc(e.venue)} ${e.year}`,link=`<b>${name}</b>`,tag=`<span class="tag">${{conference:"Conference",shared_task:"Shared task",school:"School",fellowship:"Funding"}[e.category]||""}</span>`;
  const det=[e.also&&"For "+e.also.map(x=>x.venue+" "+x.year+(x.place?" ("+x.place+")":"")).join(" · "),e.event_dates&&(e.ts==null?"":"Event ")+e.event_dates,e.place,e.note].filter(Boolean).join(" · ");
  return `<li tabindex="0" role="button" data-k="${esc(e.venue+" "+e.year)}" data-cat="${e.category}" class="${past?"past":""}">${date}<div class="t">${link} <span class="w">${esc(e.label)}</span>${det?`<div class="d">${esc(det)}</div>`:""}${tag}</div>${c?`<span class="cd${c.s?" soon":""}">${c.t}</span>`:"<span></span>"}<span class="chev">›</span></li>`;
}

function hero(){
  const now=Date.now(),nx=all.filter(e=>e.ts!=null&&!e.ap&&e.ts>=now&&!e.minor).sort((a,b)=>a.ts-b.ts)[0];
  if(!nx){$("next").innerHTML="";return}
  const d=Math.max(0,Math.ceil((nx.ts-now)/864e5)),k=nx.venue+" "+nx.year;
  $("next").innerHTML=`<a href="#${encodeURIComponent(k.replace(/ /g,"-"))}"><span class="num">${d}</span><span class="cap"><i>${d===1?"day":"days"} until</i><b>${esc(k)}</b><em>${esc(nx.label)}, ${fmt(nx.ts,{month:"long",day:"numeric"})}</em></span></a>`;
  $("next").firstChild.onclick=ev=>{ev.preventDefault();open(k)};
}
function render(){
  const now=Date.now();
  const f=all.filter(e=>(cat==="all"||e.category===cat)&&(!q||JSON.stringify(e).toLowerCase().includes(q))&&(full||((e.ts==null||e.ts>=now-864e5)&&!e.minor)));
  const dated=f.filter(e=>e.ts!=null).sort((a,b)=>a.ts-b.ts),tba=f.filter(e=>e.ts==null);
  const arr=dated.filter(e=>e.venue==="ARR"&&/submission/i.test(e.label));
  const dup=e=>e.venue!=="ARR"&&/^ARR submission/i.test(e.label)&&arr.some(a=>a.ts===e.ts);
  arr.forEach(a=>a.also=dated.filter(e=>dup(e)&&e.ts===a.ts));
  dated.splice(0,dated.length,...dated.filter(e=>!dup(e)));
  let html="",m="";
  for(const e of dated){
    const k=fmt(e.ts,{month:"long",year:"numeric"});
    if(k!==m){html+=(m?"</ul>":"")+`<h2 class="m">${k}</h2><ul>`;m=k}
    html+=item(e);
  }
  if(m)html+="</ul>";
  if(tba.length)html+=`<details${q||cat!=="all"?" open":""}><summary>Not announced yet <span>${tba.length}</span></summary><ul>${tba.map(item).join("")}</ul></details>`;
  const nx=(!q&&!full)?dated.find(e=>!e.ap&&e.ts>=now):null;
  $("list").innerHTML=html||`<p class="empty">Nothing matches.</p>`;
  $("tog").textContent=full?"Show key deadlines only":"Show all milestones and past dates";
}

</script>
</body>
</html>
