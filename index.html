<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLP Deadlines</title>
<meta name="description" content="Upcoming deadlines for NLP researchers: conferences, shared tasks, schools and funding.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--fg:#1d1d1f;--mut:#6e6e73;--line:rgba(0,0,0,.09);--fill:#f5f5f7;--blue:#0071e3;--hot:#bf4800;--ease:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--fg);font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:88px 24px 96px}
h1{font-size:3.5rem;font-weight:700;letter-spacing:-.045em;line-height:1.05;margin:0}
.sub{color:var(--mut);font-size:1.3rem;line-height:1.3;letter-spacing:-.02em;margin:14px 0 48px;max-width:520px}
.next{cursor:pointer;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;background:var(--fill);border-radius:28px;padding:32px 36px;margin-bottom:56px;transition:transform .5s var(--ease)}
.next:hover{transform:scale(1.01)}
.next small{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-bottom:10px}
.next h2{margin:0;font-size:1.9rem;font-weight:700;letter-spacing:-.035em;line-height:1.1;text-transform:none;display:block}
.next h2::after{display:none}
.next p{margin:6px 0 0;color:var(--mut);font-size:1rem}
.next .big{font-size:4rem;font-weight:700;letter-spacing:-.05em;line-height:.9;text-align:right;white-space:nowrap}
.next .big i{display:block;font-style:normal;font-size:.9rem;font-weight:500;letter-spacing:-.01em;color:var(--mut);margin-top:8px}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 0;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
#nav{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:0;flex-wrap:wrap}
#nav button{all:unset;cursor:pointer;font-size:.85rem;font-weight:500;color:var(--fg);padding:6px 14px;border-radius:8px;transition:background .25s,box-shadow .25s}
#nav button:hover{color:#000}
#nav button[aria-pressed=true]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.search{position:relative}
.search input{border:0;background:var(--fill);border-radius:10px;font:inherit;font-size:.9rem;padding:7px 12px 7px 32px;width:170px;outline:none;color:var(--fg);transition:box-shadow .25s,width .3s var(--ease)}
.search input:focus{box-shadow:0 0 0 3px rgba(0,113,227,.3);width:220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
h2.m{font-size:1.5rem;font-weight:700;letter-spacing:-.03em;margin:56px 0 8px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:64px 1fr auto 12px;gap:0 16px;align-items:center;padding:20px 14px;margin:0 -14px;border-radius:16px;cursor:pointer;position:relative;transition:background .25s}
li+li::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;background:var(--line)}
li:hover{background:var(--fill)}
li:hover::before,li:hover+li::before{opacity:0}
li.past{opacity:.45}
.date{line-height:1}
.date small{display:block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.date b{font-size:1.8rem;font-weight:600;letter-spacing:-.04em}
.date.tba b{font-size:1rem;color:var(--mut);letter-spacing:0}
.t{min-width:0}
.t b{font-weight:600;letter-spacing:-.02em}
.w{color:var(--fg)}
.d{color:var(--mut);font-size:.88rem;margin-top:3px;line-height:1.4}
.cd{font-size:.88rem;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.cd.soon{color:var(--hot);font-weight:600}
.chev{color:#c7c7cc;font-size:1.3rem;line-height:1;transition:transform .3s var(--ease)}
li:hover .chev{transform:translateX(3px);color:var(--mut)}
details{margin-top:56px}
summary{cursor:pointer;font-size:1.5rem;font-weight:700;letter-spacing:-.03em;color:var(--fg);list-style:none;margin-bottom:8px;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"›";color:var(--mut);transition:transform .3s var(--ease);font-weight:400}
details[open] summary::after{transform:rotate(90deg)}
summary span{color:var(--mut);font-weight:500}
.tog{all:unset;cursor:pointer;color:var(--blue);font-size:.95rem;margin-top:48px;display:inline-block}
.tog:hover{text-decoration:underline}
.empty{color:var(--mut);margin-top:40px}
footer{margin-top:72px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:.8rem;line-height:1.6}
footer a{color:inherit;text-decoration:underline;text-decoration-color:rgba(0,0,0,.25)}
dialog{border:0;border-radius:28px;padding:0;width:min(600px,calc(100vw - 24px));max-height:calc(100vh - 48px);color:var(--fg);background:rgba(255,255,255,.96);backdrop-filter:blur(30px);box-shadow:0 40px 100px -20px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.08);animation:pop .45s var(--ease)}
dialog::backdrop{background:rgba(0,0,0,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}}
@keyframes fade{from{opacity:0}}
.sheet{padding:36px 36px 28px;overflow:auto;max-height:calc(100vh - 48px)}
.x{all:unset;cursor:pointer;position:absolute;top:18px;right:18px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.06);display:grid;place-items:center;font-size:1.15rem;color:var(--mut);transition:background .2s}
.x:hover{background:rgba(0,0,0,.11)}
.kind{font-size:.8rem;font-weight:600;color:var(--mut)}
.sheet h3{font-size:2.3rem;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin:6px 0 8px;padding-right:36px}
.meta{color:var(--mut);font-size:1rem}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 8px}
.btn{font-size:.95rem;font-weight:500;text-decoration:none;padding:10px 20px;border-radius:999px;background:var(--fill);color:var(--blue);transition:transform .25s var(--ease),background .2s}
.btn:hover{background:#ebebef}.btn:active{transform:scale(.97)}
.btn.p{background:var(--blue);color:#fff}
.btn.p:hover{background:#0077ed}
.tl{margin:28px 0 0}
.tl h4{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
.tr{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line);font-size:.95rem}
.tl h4+.tr{border-top:0}
.tr .l{color:var(--fg)}.tr .r{color:var(--mut);white-space:nowrap;font-size:.9rem}
.tr.now .l{font-weight:600}.tr.now .r{color:var(--blue);font-weight:600}
.tr.gone{opacity:.4}
.notes{margin-top:20px;padding:14px 16px;border-radius:14px;background:var(--fill);color:#515154;font-size:.88rem}
.note-aoe{margin-top:18px;color:var(--mut);font-size:.75rem}
@media(max-width:560px){main{padding:48px 20px 72px}h1{font-size:2.5rem}.sub{font-size:1.1rem;margin-bottom:32px}.next{padding:24px;flex-direction:column;align-items:flex-start;border-radius:24px;margin-bottom:36px}.next .big{text-align:left;font-size:3rem}li{grid-template-columns:48px 1fr 12px;gap:0 12px}.cd{grid-column:2;grid-row:2;margin-top:2px}.chev{grid-row:1;grid-column:3}.date b{font-size:1.5rem}.sheet{padding:28px 22px 22px}.sheet h3{font-size:1.8rem}.search input,.search input:focus{width:100%}.search{width:100%}#nav{width:100%}#nav button{flex:1;text-align:center;padding:6px 6px}}

/* sleek pass: monochrome, hairlines, black accent (Apple / SpaceX / OpenAI) */
:root{--blue:#000;--fill:#f4f4f5;--line:rgba(0,0,0,.1);--hot:#000}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;font-size:16px}
main{max-width:860px;padding:120px 28px 120px}
h1{font-size:clamp(3rem,8vw,5.5rem);font-weight:600;letter-spacing:-.055em;line-height:.98}
.sub{font-size:.75rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:28px 0 72px;max-width:none}
.next{background:#000;color:#fff;border-radius:6px;padding:44px 44px;margin-bottom:72px;align-items:flex-end}
.next:hover{transform:none;background:#111}
.next small{color:rgba(255,255,255,.55);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.next h2{font-size:2rem;font-weight:600;color:#fff}
.next p{color:rgba(255,255,255,.6)}
.next .big{font-size:5rem;font-weight:500;letter-spacing:-.06em}
.next .big i{color:rgba(255,255,255,.55);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
.bar{border-bottom:1px solid var(--line);padding:16px 0}
#nav{background:none;padding:0;gap:4px}
#nav button{font-size:.72rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:8px 14px;border-radius:999px}
#nav button:hover{color:#000}
#nav button[aria-pressed=true]{background:#000;color:#fff;box-shadow:none;font-weight:500}
.search input{background:none;border-radius:0;border-bottom:1px solid var(--line);padding:8px 4px 8px 24px;width:140px;font-size:.85rem}
.search input:focus{box-shadow:none;border-color:#000;width:200px}
.search svg{left:2px}
:focus-visible{outline:2px solid #000}
h2.m,summary{font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:72px 0 4px}
details{margin-top:0}
summary span{font-weight:500}
li{border-radius:0;padding:24px 0;margin:0;grid-template-columns:76px 1fr auto 16px}
li+li::before{left:0;right:0}
li:hover{background:none}
li:hover .t b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.date small{letter-spacing:.14em;font-weight:500}
.date b{font-weight:500;font-size:2rem;letter-spacing:-.05em}
.t b{font-weight:500;font-size:1.05rem}
.cd{font-size:.8rem;letter-spacing:.02em}
.cd.soon{color:#000;font-weight:600}
.chev{color:#bbb}
.tog{color:#000;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid #000;padding-bottom:3px;margin-top:56px}
.tog:hover{text-decoration:none;opacity:.6}
footer{border-top:1px solid var(--line);margin-top:96px}
dialog{border-radius:6px;background:#fff;box-shadow:0 30px 90px -20px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(255,255,255,.7)}
.sheet{padding:48px 44px 36px}
.x{border-radius:50%;background:none;border:1px solid var(--line)}
.kind{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.sheet h3{font-size:2.8rem;font-weight:600;letter-spacing:-.05em}
.btn{background:none;color:#000;border:1px solid rgba(0,0,0,.25);border-radius:999px;padding:11px 22px;font-size:.85rem}
.btn:hover{background:none;border-color:#000}
.btn.p{background:#000;color:#fff;border-color:#000}
.btn.p:hover{background:#222}
.tl h4{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:500;margin-bottom:8px}
.tr.now .r{color:#000}
.notes{border-radius:4px}
@media(max-width:560px){main{padding:64px 20px 80px}.next{padding:28px;border-radius:6px}.next .big{font-size:3.4rem}.sheet{padding:36px 24px 28px}.sheet h3{font-size:2.1rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>NLP Deadlines</h1>
<p class="sub" id="sub">&nbsp;</p>
<div id="next"></div>
<div class="bar"><div id="nav" role="group" aria-label="Filter"></div><label class="search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg><input type="search" id="q" placeholder="Search" aria-label="Search"></label></div>
<div id="list"></div>
<button class="tog" id="tog" aria-pressed="false"></button>
<dialog id="dlg" aria-label="Event details"></dialog>
<footer>Times are “anywhere on Earth” (UTC−12) unless noted. Always confirm on the official site.<br>Data: hand-checked + <a href="https://github.com/ccfddl/ccf-deadlines">ccf-deadlines</a>, refreshed daily · <a href="https://github.com/vikion/nlp-deadlines">GitHub</a></footer>
</main>
<script>
const CATS={all:"All",conference:"Conferences",shared_task:"Shared tasks",school:"Schools",fellowship:"Funding"};
const MINOR=/camera|notification|workshop|proposal|show & tell|update deadline|evaluation period|tutorial|challenge|special session|satellite|open on openreview/i;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let all=[],cat="all",full=false,q="",venues={};
$("nav").innerHTML=Object.entries(CATS).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k==='all'}">${v}</button>`).join("");
$("nav").onclick=e=>{const k=e.target.dataset.k;if(!k)return;cat=k;document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));render()};
$("q").oninput=e=>{q=e.target.value.toLowerCase();render()};
$("tog").onclick=()=>{full=!full;render()};
fetch("data/deadlines.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  venues=d.venues||{};all=d.entries.map(e=>{const ap=e.precision==="month";return{...e,ap,minor:MINOR.test(e.label),ts:e.date?new Date(ap?e.date+"-28T23:59:00-12:00":e.date).getTime():null}});
  $("sub").textContent="Conferences, shared tasks, schools and funding · updated "+d.generated.slice(0,10);
  render();openHash();
}).catch(()=>{$("sub").textContent="Could not load the data. Open this page through GitHub Pages or a local web server."});

const dlg=$("dlg");
const cats={conference:"Conference",shared_task:"Shared task",school:"School",fellowship:"Funding"};
function open(key){
  const g=all.filter(e=>e.venue+" "+e.year===key).sort((a,b)=>(a.ts??9e15)-(b.ts??9e15));
  if(!g.length)return;
  const e0=g[0],ev=g.find(e=>e.event_dates)?.event_dates,pl=g.find(e=>e.place)?.place;
  let links=venues[key];
  if(!links){const u=[...new Set(g.map(e=>e.link).filter(Boolean))];links=u.map((url,i)=>({label:i?"Link":"Website",url,primary:!i}))}
  const now=Date.now(),nxt=g.find(e=>e.ts!=null&&!e.ap&&e.ts>=now);
  const rows=g.map(e=>{
    const when=e.ts==null?"Date TBA":e.ap?fmt(e.ts,{month:"long",year:"numeric"})+" (tentative)":fmt(e.ts,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    const gone=e.ts!=null&&!e.ap&&e.ts<now;
    return `<div class="tr${e===nxt?" now":""}${gone?" gone":""}"><span class="l">${esc(e.label)}</span><span class="r">${when}</span></div>`}).join("");
  const notes=[...new Set(g.map(e=>e.note).filter(Boolean))];
  dlg.innerHTML=`<div class="sheet"><button class="x" aria-label="Close">×</button>
  <div class="kind">${cats[e0.category]||""}</div>
  <h3>${esc(key)}</h3><div class="meta">${[ev&&"Event "+esc(ev),esc(pl)].filter(Boolean).join(" · ")}</div>
  <div class="acts">${links.map(l=>`<a class="btn${l.primary?" p":""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
  <div class="tl"><h4>Key dates</h4>${rows}</div>
  ${notes.length?`<div class="notes">${notes.map(esc).join("<br>")}</div>`:""}
  <div class="note-aoe">Times are AoE (UTC−12) unless noted. Confirm on the official site.</div></div>`;
  dlg.querySelector(".x").onclick=()=>dlg.close();
  if(!dlg.open)dlg.showModal();
  history.replaceState(null,"","#"+encodeURIComponent(key.replace(/ /g,"-")));
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener("close",()=>history.replaceState(null,"",location.pathname+location.search));
$("list").addEventListener("click",e=>{const li=e.target.closest("li[data-k]");if(li)open(li.dataset.k)});
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const li=e.target.closest("li[data-k]");if(li){e.preventDefault();open(li.dataset.k)}}});
$("next").addEventListener("click",()=>{const n=all.filter(e=>e.ts!=null&&!e.ap&&e.ts>=Date.now()&&!e.minor).sort((a,b)=>a.ts-b.ts)[0];if(n)open(n.venue+" "+n.year)});
function openHash(){if(location.hash.length>1)open(decodeURIComponent(location.hash.slice(1)).replace(/-/g," "))}
const AOE="Etc/GMT+12",fmt=(ts,o)=>new Date(ts).toLocaleDateString("en",{...o,timeZone:AOE});
function cd(e){
  if(e.ap)return{t:"tentative"};
  const d=Math.ceil((e.ts-Date.now())/864e5);
  return d<0?{t:"passed"}:d===0?{t:"today",s:1}:{t:d===1?"tomorrow":d+" days",s:d<=14};
}
function item(e){
  const c=e.ts!=null?cd(e):null,past=c&&c.t==="passed";
  const date=e.ts==null?`<div class="date tba"><b>TBA</b></div>`:`<div class="date"><small>${fmt(e.ts,{month:"short"})}</small><b>${e.ap?"~":fmt(e.ts,{day:"numeric"})}</b></div>`;
  const name=`${esc(e.venue)} ${e.year}`,link=`<b>${name}</b>`;
  const det=[e.also&&"For "+e.also.map(x=>x.venue+" "+x.year+(x.place?" ("+x.place+")":"")).join(" · "),e.event_dates&&(e.ts==null?"":"Event ")+e.event_dates,e.place,e.note].filter(Boolean).join(" · ");
  return `<li tabindex="0" role="button" data-k="${esc(e.venue+" "+e.year)}" class="${past?"past":""}">${date}<div class="t">${link} <span class="w">${esc(e.label)}</span>${det?`<div class="d">${esc(det)}</div>`:""}</div>${c?`<span class="cd${c.s?" soon":""}">${c.t}</span>`:"<span></span>"}<span class="chev">›</span></li>`;
}
function render(){
  const now=Date.now();
  const f=all.filter(e=>(cat==="all"||e.category===cat)&&(!q||JSON.stringify(e).toLowerCase().includes(q))&&(full||((e.ts==null||e.ts>=now-864e5)&&!e.minor)));
  const dated=f.filter(e=>e.ts!=null).sort((a,b)=>a.ts-b.ts),tba=f.filter(e=>e.ts==null);
  const arr=dated.filter(e=>e.venue==="ARR"&&/submission/i.test(e.label));
  const dup=e=>e.venue!=="ARR"&&/^ARR submission/i.test(e.label)&&arr.some(a=>a.ts===e.ts);
  arr.forEach(a=>a.also=dated.filter(e=>dup(e)&&e.ts===a.ts));
  dated.splice(0,dated.length,...dated.filter(e=>!dup(e)));
  let html="",m="";
  for(const e of dated){
    const k=fmt(e.ts,{month:"long",year:"numeric"});
    if(k!==m){html+=(m?"</ul>":"")+`<h2 class="m">${k}</h2><ul>`;m=k}
    html+=item(e);
  }
  if(m)html+="</ul>";
  if(tba.length)html+=`<details${q||cat!=="all"?" open":""}><summary>Not announced yet <span>${tba.length}</span></summary><ul>${tba.map(item).join("")}</ul></details>`;
  const nx=(!q&&!full)?dated.find(e=>!e.ap&&e.ts>=now):null;
  $("next").innerHTML=nx?(()=>{const c=cd(nx);return `<div class="next"><div><small>Next deadline</small><h2>${esc(nx.venue)} ${nx.year}</h2><p>${esc(nx.label)} · ${fmt(nx.ts,{weekday:"long",month:"long",day:"numeric"})}</p></div><div class="big">${c.t.replace(" days","")}<i>${/day/.test(c.t)?"days left":""}</i></div></div>`})():"";
  $("list").innerHTML=html||`<p class="empty">Nothing matches.</p>`;
  $("tog").textContent=full?"Show key deadlines only":"Show all milestones and past dates";
}
</script>
</body>
</html>
