<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NLP Deadlines</title>
<meta name="description" content="Upcoming deadlines for NLP researchers: conferences, shared tasks, schools and funding.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#111;--mut:#8a8a8a;--line:#ececec;--acc:#2545d3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Inter,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
main{max-width:720px;margin:0 auto;padding:0 24px 80px}
.head{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:28px 0 0}
h1{font-size:1rem;font-weight:600;margin:0 auto 0 0;letter-spacing:-.01em}
#nav{display:flex;gap:20px}
#nav button{all:unset;cursor:pointer;color:var(--mut);font-size:.9rem;transition:color .15s}
#nav button svg{display:none}
#nav button:hover{color:var(--ink)}
#nav button[aria-pressed=true]{color:var(--acc)}
.search input{border:0;background:none;font:inherit;font-size:.9rem;width:90px;text-align:right;outline:none;color:var(--ink)}
.search input::placeholder{color:var(--mut)}
.search svg{display:none}
.intro{margin-top:96px}
.sub{display:none}
#next{font-size:1.5rem;letter-spacing:-.025em;line-height:1.3;font-weight:500}
#next a{text-decoration:none;color:var(--ink)}
#next a b{font-weight:600}
#next a{transition:color .15s}
#next a:hover{color:var(--acc)}
h2.m,summary{font-size:.85rem;font-weight:500;color:var(--mut);margin:72px 0 6px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" +"}
details[open] summary::after{content:" –"}
summary span{margin-left:2px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:64px 1fr auto;gap:0 16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
li:first-child{border-top:0}
li:hover .t b{color:var(--acc)}
li.past{opacity:.4}
.date{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.date small{display:none}
.date b{font-weight:400}
.t{min-width:0}
.t b{font-weight:600;transition:color .15s}
.d{color:var(--mut);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tag{display:none}
.cd{color:var(--mut);font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.cd.soon{color:var(--acc)}
.chev{display:none}
.tog{all:unset;cursor:pointer;display:block;margin-top:56px;color:var(--mut);font-size:.9rem}
.tog:hover{color:var(--ink)}
.empty{color:var(--mut);margin-top:40px}
footer{margin-top:88px;color:var(--mut);font-size:.8rem;line-height:1.7}
footer .row3{display:none}
footer p{margin:0}
footer a{text-underline-offset:2px}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 48px);color:var(--ink);background:#fff;box-shadow:0 24px 70px -12px rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.06)}
dialog[open]{animation:pop .2s ease}
dialog::backdrop{background:rgba(255,255,255,.7);backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.sheet{padding:30px;overflow:auto;max-height:calc(100vh - 48px)}
.x{all:unset;cursor:pointer;position:absolute;top:16px;right:18px;color:var(--mut);font-size:1.4rem;line-height:1}
.x:hover{color:var(--ink)}
.kind{color:var(--mut);font-size:.85rem}
.sheet h3{font-size:1.7rem;font-weight:600;letter-spacing:-.03em;line-height:1.15;margin:2px 0 4px;padding-right:30px}
.meta{color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
.btn{font-size:.9rem;text-decoration:none;padding:8px 14px;border-radius:8px;border:1px solid var(--line);color:var(--ink);transition:border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:#1c37b0}
.tl{margin-top:24px}
.tl h4{font-size:.85rem;font-weight:500;color:var(--mut);margin:0 0 4px}
.tr{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.tl h4+.tr{border-top:0}
.tr .r{color:var(--mut);white-space:nowrap}
.tr.now .l,.tr.now .r{color:var(--acc)}
.tr.gone{opacity:.4}
.notes{margin-top:16px;color:var(--mut);font-size:.85rem}
.note-aoe{margin-top:14px;color:var(--mut);font-size:.75rem}
@media(max-width:560px){main{padding:0 20px 64px}.intro{margin-top:56px}#next{font-size:1.25rem}li{grid-template-columns:54px 1fr auto;gap:0 10px}.sheet{padding:24px 20px}.head{gap:10px 18px}h1{flex:1 0 100%}.search{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<header class="head"><h1>NLP Deadlines</h1><div id="nav" role="group" aria-label="Filter"></div><label class="search"><svg viewBox="0 0 16 16"></svg><input type="search" id="q" placeholder="Search" aria-label="Search"></label></header>
<div class="intro"><div id="next"></div><p class="sub" id="sub"></p></div>
<div id="list"></div>
<button class="tog" id="tog" aria-pressed="false"></button>
<dialog id="dlg" aria-label="Event details"></dialog>
<footer><p>Times are “anywhere on Earth” (UTC−12) unless noted. Confirm on the official site.<br><span id="upd"></span> · Data: hand-checked + <a href="https://github.com/ccfddl/ccf-deadlines">ccf-deadlines</a>, refreshed daily · <a href="https://github.com/vikion/nlp-deadlines">GitHub</a></p></footer>
</main>
<script>
const CATS={all:"All",conference:"Conferences",shared_task:"Shared tasks",school:"Schools",fellowship:"Funding"};
const MINOR=/camera|notification|workshop|proposal|show & tell|update deadline|evaluation period|tutorial|challenge|special session|satellite|open on openreview/i;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let all=[],cat="all",full=false,q="",venues={};
const IC={all:`<path d="M24 8v32M8 24h32M13 13l22 22M35 13L13 35"/>`,conference:`<path d="M12 8h20l6 6v26H12z"/><path d="M32 8v6h6M17 22h16M17 28h16M17 34h10"/>`,shared_task:`<path d="M16 8h16v10a8 8 0 0 1-16 0zM16 12H9v3a6 6 0 0 0 7 6M32 12h7v3a6 6 0 0 1-7 6M24 26v8M17 40h14"/>`,school:`<path d="M4 18L24 8l20 10-20 10zM12 23v10c0 3 6 6 12 6s12-3 12-6V23M44 18v12"/>`,fellowship:`<circle cx="24" cy="24" r="15"/><path d="M24 15v18M18 20c0-4 12-4 12 0s-12 3-12 7 12 4 12 0"/>`};
$("nav").innerHTML=Object.entries(CATS).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k==='all'}"><svg viewBox="0 0 48 48" aria-hidden="true">${IC[k]}</svg><span>${v}</span></button>`).join("");
$("nav").onclick=e=>{const bt=e.target.closest("button");const k=bt&&bt.dataset.k;if(!k)return;cat=k;document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));render()};
$("q").oninput=e=>{q=e.target.value.toLowerCase();render()};
$("tog").onclick=()=>{full=!full;render()};
fetch("data/deadlines.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
  venues=d.venues||{};all=d.entries.map(e=>{const ap=e.precision==="month";return{...e,ap,minor:MINOR.test(e.label),ts:e.date?new Date(ap?e.date+"-28T23:59:00-12:00":e.date).getTime():null}});
  $("sub").textContent="Conferences, shared tasks, schools and funding.";
  $("upd").textContent="Updated "+d.generated.slice(0,10).split("-").reverse().join(".");hero();render();openHash();
}).catch(()=>{$("sub").textContent="Could not load the data. Open this page through GitHub Pages or a local web server."});

const dlg=$("dlg");
const cats={conference:"Conference",shared_task:"Shared task",school:"School",fellowship:"Funding"};
function open(key){
  const g=all.filter(e=>e.venue+" "+e.year===key).sort((a,b)=>(a.ts??9e15)-(b.ts??9e15));
  if(!g.length)return;
  const e0=g[0],ev=g.find(e=>e.event_dates)?.event_dates,pl=g.find(e=>e.place)?.place;
  let links=venues[key];
  if(!links){const u=[...new Set(g.map(e=>e.link).filter(Boolean))];links=u.map((url,i)=>({label:i?"Link":"Website",url,primary:!i}))}
  const now=Date.now(),nxt=g.find(e=>e.ts!=null&&!e.ap&&e.ts>=now);
  const rows=g.map(e=>{
    const when=e.ts==null?"Date TBA":e.ap?fmt(e.ts,{month:"long",year:"numeric"})+" (tentative)":fmt(e.ts,{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    const gone=e.ts!=null&&!e.ap&&e.ts<now;
    return `<div class="tr${e===nxt?" now":""}${gone?" gone":""}"><span class="l">${esc(e.label)}</span><span class="r">${when}</span></div>`}).join("");
  const notes=[...new Set(g.map(e=>e.note).filter(Boolean))];
  dlg.innerHTML=`<div class="sheet"><button class="x" aria-label="Close">×</button>
  <div class="kind">${cats[e0.category]||""}</div>
  <h3>${esc(key)}</h3><div class="meta">${[ev&&"Event "+esc(ev),esc(pl)].filter(Boolean).join(" · ")}</div>
  <div class="acts">${links.map(l=>`<a class="btn${l.primary?" p":""}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>
  <div class="tl"><h4>Key dates</h4>${rows}</div>
  ${notes.length?`<div class="notes">${notes.map(esc).join("<br>")}</div>`:""}
  <div class="note-aoe">Times are AoE (UTC−12) unless noted. Confirm on the official site.</div></div>`;
  dlg.querySelector(".x").onclick=()=>dlg.close();
  if(!dlg.open)dlg.showModal();
  history.replaceState(null,"","#"+encodeURIComponent(key.replace(/ /g,"-")));
}
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener("close",()=>history.replaceState(null,"",location.pathname+location.search));
$("list").addEventListener("click",e=>{const li=e.target.closest("li[data-k]");if(li)open(li.dataset.k)});
$("list").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const li=e.target.closest("li[data-k]");if(li){e.preventDefault();open(li.dataset.k)}}});
function openHash(){if(location.hash.length>1)open(decodeURIComponent(location.hash.slice(1)).replace(/-/g," "))}
const dm=ts=>{const p=new Intl.DateTimeFormat("en",{day:"2-digit",month:"2-digit",timeZone:"Etc/GMT+12"}).formatToParts(ts);return p.find(x=>x.type==="day").value+"."+p.find(x=>x.type==="month").value};
const AOE="Etc/GMT+12",fmt=(ts,o)=>new Date(ts).toLocaleDateString("en",{...o,timeZone:AOE});
function cd(e){
  if(e.ap)return{t:"tentative"};
  const d=Math.ceil((e.ts-Date.now())/864e5);
  return d<0?{t:"passed"}:d===0?{t:"today",s:1}:{t:d===1?"tomorrow":d+" days",s:d<=14};
}
function item(e){
  const c=e.ts!=null?cd(e):null,past=c&&c.t==="passed";
  const date=e.ts==null?`<div class="date tba"><b>TBA</b></div>`:`<div class="date"><b>${e.ap?"~"+fmt(e.ts,{month:"short"}):fmt(e.ts,{day:"numeric",month:"short"})}</b></div>`;
  const name=`${esc(e.venue)} ${e.year}`,link=`<b>${name}</b>`,tag=`<span class="tag">${{conference:"Conference",shared_task:"Shared task",school:"School",fellowship:"Funding"}[e.category]||""}</span>`;
  const det=[e.also&&"For "+e.also.map(x=>x.venue+" "+x.year+(x.place?" ("+x.place+")":"")).join(" · "),e.event_dates&&(e.ts==null?"":"Event ")+e.event_dates,e.place,e.note].filter(Boolean).join(" · ");
  return `<li tabindex="0" role="button" data-k="${esc(e.venue+" "+e.year)}" data-cat="${e.category}" class="${past?"past":""}">${date}<div class="t">${link} <span class="w">${esc(e.label)}</span>${det?`<div class="d">${esc(det)}</div>`:""}${tag}</div>${c?`<span class="cd${c.s?" soon":""}">${c.t}</span>`:"<span></span>"}<span class="chev">›</span></li>`;
}

function hero(){
  const now=Date.now(),nx=all.filter(e=>e.ts!=null&&!e.ap&&e.ts>=now&&!e.minor).sort((a,b)=>a.ts-b.ts)[0];
  if(!nx){$("next").innerHTML="";return}
  const d=Math.max(0,Math.ceil((nx.ts-now)/864e5)),k=nx.venue+" "+nx.year;
  $("next").innerHTML=`<a href="#${encodeURIComponent(k.replace(/ /g,"-"))}">Next: <b>${esc(k)}</b> ${esc(nx.label.charAt(0).toLowerCase()+nx.label.slice(1))} · ${d===0?"today":d===1?"tomorrow":"in "+d+" days"} →</a>`;
  $("next").firstChild.onclick=ev=>{ev.preventDefault();open(k)};
}
function render(){
  const now=Date.now();
  const f=all.filter(e=>(cat==="all"||e.category===cat)&&(!q||JSON.stringify(e).toLowerCase().includes(q))&&(full||((e.ts==null||e.ts>=now-864e5)&&!e.minor)));
  const dated=f.filter(e=>e.ts!=null).sort((a,b)=>a.ts-b.ts),tba=f.filter(e=>e.ts==null);
  const arr=dated.filter(e=>e.venue==="ARR"&&/submission/i.test(e.label));
  const dup=e=>e.venue!=="ARR"&&/^ARR submission/i.test(e.label)&&arr.some(a=>a.ts===e.ts);
  arr.forEach(a=>a.also=dated.filter(e=>dup(e)&&e.ts===a.ts));
  dated.splice(0,dated.length,...dated.filter(e=>!dup(e)));
  let html="",m="";
  for(const e of dated){
    const k=fmt(e.ts,{month:"long",year:"numeric"});
    if(k!==m){html+=(m?"</ul>":"")+`<h2 class="m">${k}</h2><ul>`;m=k}
    html+=item(e);
  }
  if(m)html+="</ul>";
  if(tba.length)html+=`<details${q||cat!=="all"?" open":""}><summary>Not announced yet <span>${tba.length}</span></summary><ul>${tba.map(item).join("")}</ul></details>`;
  const nx=(!q&&!full)?dated.find(e=>!e.ap&&e.ts>=now):null;
  $("list").innerHTML=html||`<p class="empty">Nothing matches.</p>`;
  $("tog").textContent=full?"Show key deadlines only":"Show all milestones and past dates";
}

</script>
</body>
</html>
