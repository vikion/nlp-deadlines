name: Update deadlines
on:
  schedule: [{cron: "17 4 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml && python scripts/update.py
      - name: Commit if changed
        run: |
          git config user.name "deadlines-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/deadlines.json
          git diff --cached --quiet || (git commit -m "Update deadlines" && git push)
